name: V8
on:
  pull_request:
  push:
    branches: ['audit/**']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: v8-${{ github.ref }}
  cancel-in-progress: true
jobs:
  critical:
    name: V8 critical QA
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      evidence: ${{ steps.submission.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit
      - name: Verify immutable canonical V8
        run: |
          echo '537ef9de19bd30c39a8f1a10df8dd2f56558f742800abb78be053f37c5845085  vendor/v8/.v8-integrity.json' | sha256sum -c
          node vendor/v8/scripts/verify-integrity.mjs --verify
          node vendor/v8/scripts/test-v8.mjs
      - run: node scripts/run-check.mjs release-guard node --test tests/release-guard.test.mjs tests/evidence-api.test.mjs
      - run: node scripts/run-check.mjs lint node node_modules/eslint/bin/eslint.js app components data lib types tests scripts playwright.config.ts next.config.ts
      - run: node scripts/run-check.mjs build node node_modules/next/dist/bin/next build
      - run: node scripts/run-check.mjs typecheck node node_modules/typescript/bin/tsc --noEmit
      - run: node scripts/run-check.mjs dependency npm audit --omit=dev --audit-level=high
      - name: Secret scan of candidate tree
        run: |
          curl --fail --location --silent --show-error -o /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          curl --fail --location --silent --show-error -o /tmp/gitleaks-checksums.txt https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
          cd /tmp
          grep 'gitleaks_8.30.1_linux_x64.tar.gz$' gitleaks-checksums.txt | sed 's/gitleaks_8.30.1_linux_x64.tar.gz/gitleaks.tar.gz/' | sha256sum -c
          tar -xzf gitleaks.tar.gz gitleaks
          cd "$GITHUB_WORKSPACE"
          /tmp/gitleaks dir . --redact --exit-code 1
      - run: npx playwright install --with-deps chromium
      - name: Browser regression against production build
        run: |
          npm start -- --hostname 127.0.0.1 --port 3418 > /tmp/lss-server.log 2>&1 &
          for i in $(seq 1 60); do curl --fail --silent http://127.0.0.1:3418 >/dev/null && break; sleep 1; done
          node scripts/run-check.mjs browser node node_modules/playwright/cli.js test
      - name: Replay independently authored browser and source checks
        run: |
          node scripts/run-check.mjs independent-browser node tests/independent/runtime.cjs
          node scripts/run-check.mjs independent-source node tests/independent/source-ci.mjs
      - name: Measure candidate performance in the runner (laboratory)
        run: |
          export CHROME_PATH="$(node -p "require('playwright').chromium.executablePath()")"
          node -e "require('fs').mkdirSync('.audit-private/performance',{recursive:true})"
          node scripts/run-check.mjs performance-mobile node node_modules/lighthouse/cli/index.js http://127.0.0.1:3418 --output=json --output-path=.audit-private/performance/mobile.json --chrome-flags='--headless --no-sandbox' --quiet
          node scripts/run-check.mjs performance-desktop node node_modules/lighthouse/cli/index.js http://127.0.0.1:3418 --preset=desktop --output=json --output-path=.audit-private/performance/desktop.json --chrome-flags='--headless --no-sandbox' --quiet
      - name: Preserve source review and attach actual CI replay evidence
        env:
          V8_INDEPENDENT_REVIEW_JSON: ${{ vars.V8_INDEPENDENT_REVIEW_JSON }}
        run: node scripts/replay-independent.mjs
      - name: Assemble submitted evidence without changing review results
        run: node scripts/assemble-evidence.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        id: submission
        with:
          name: v8-submitted-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: .audit-private/
          include-hidden-files: true
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v8-regression-${{ github.event.pull_request.head.sha || github.sha }}
          path: test-results/
          retention-days: 14
  custody:
    name: V8 owner authorization and custody
    needs: critical
    environment: v8-release-approval
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ github.token }}
    outputs:
      evidence: ${{ steps.certified.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - name: Authenticate same-run evidence and server-recorded owner approval
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVIDENCE_ARTIFACT_ID: ${{ needs.critical.outputs.evidence }}
        run: node scripts/custody-evidence.mjs
      - run: node scripts/release-guard.mjs V8_DELIVERY_EVIDENCE.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        id: certified
        with:
          name: v8-certified-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: .audit-private/
          include-hidden-files: true
          retention-days: 30
  certification:
    name: V8 delivery certification
    needs: [critical, custody]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Reject failed, cancelled or skipped prerequisite jobs
        run: test '${{ needs.critical.result }}' = success && test '${{ needs.custody.result }}' = success
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - name: Retrieve authenticated evidence for the exact candidate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          V8_EVIDENCE_ARTIFACT_ID: ${{ needs.custody.outputs.evidence }}
        run: node scripts/fetch-evidence.mjs
      - run: node scripts/release-guard.mjs V8_DELIVERY_EVIDENCE.json
